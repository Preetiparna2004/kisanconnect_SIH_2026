services:
  - type: web
    name: kisanconnect-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./kisanconnect.db
      - key: DEBUG
        value: false
      - key: ALLOWED_ORIGINS
        value: https://kisanconnectt.netlify.app
